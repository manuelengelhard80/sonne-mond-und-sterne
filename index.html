    <script>
      // Compatibility patch for preview environments and extensions (e.g. frame_ant) that monkey-patch window.fetch
      (function() {
        try {
          var _nativeFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _nativeFetch;
            },
            set: function(fn) {
              _nativeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();

      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('deferred-prompt-ready', { detail: e }));
      });
      window.addEventListener('appinstalled', function() {
        window.deferredInstallPrompt = null;
      });
      if ('serviceWorker' in navigator) {
        var registerSW = function() {
          navigator.serviceWorker.register('/sw.js?v=25', { scope: '/' }).then(function(reg) {
            if (reg) {
              reg.update().catch(function() {});
              if (reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
              reg.addEventListener('updatefound', function() {
                var newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', function() {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
            }
          }).catch(function(err) {
            console.warn('SW registration warning:', err);
          });
        };

        window.addEventListener('load', registerSW);
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          registerSW();
        }
      }
    </script>
